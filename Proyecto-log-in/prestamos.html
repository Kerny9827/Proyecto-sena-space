<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOG-IN - Préstamos</title>
<link rel="stylesheet" href="vendor/fontawesome-free/css/all.min.css">
<link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="css/sb-admin-2.min.css">
<style>
body{background:#f8f9fc}.loan-wrap{max-width:1180px;margin:35px auto;padding:0 18px}.loan-card{background:#fff;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.07);padding:24px;margin-bottom:22px}.loan-title{font-weight:700;color:#4e73df}.loan-muted{color:#6c757d}.loan-badge{display:inline-block;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:600}.pending{background:#fff3cd;color:#856404}.approved{background:#d4edda;color:#155724}.rejected{background:#f8d7da;color:#721c24}.returned{background:#d1ecf1;color:#0c5460}.available{background:#e8f5e9;color:#1b5e20}.unavailable{background:#f8d7da;color:#721c24}.table td,.table th{vertical-align:middle}.form-control:focus{box-shadow:0 0 0 .2rem rgba(78,115,223,.15)}
</style>
</head>
<body id="page-top">
<div class="loan-wrap">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div><h1 class="h3 loan-title mb-1"><i class="fas fa-hand-holding"></i> Solicitar préstamo</h1><p class="loan-muted mb-0">Solicita un recurso disponible y consulta el estado de tus préstamos.</p></div>
    <a href="recursos.html" class="btn btn-light"><i class="fas fa-arrow-left mr-1"></i> Recursos</a>
  </div>

  <div class="loan-card">
    <h2 class="h5 font-weight-bold mb-3">Nueva solicitud</h2>
    <form id="loanForm">
      <div class="row">
        <div class="col-md-6 mb-3"><label>Nombre del solicitante *</label><input id="nombre" class="form-control" required></div>
        <div class="col-md-3 mb-3"><label>Ficha</label><input id="ficha" class="form-control" inputmode="numeric" placeholder="Ej. 2876543"></div>
        <div class="col-md-3 mb-3"><label>Teléfono</label><input id="telefono" class="form-control" type="tel" placeholder="Ej. 3001234567"></div>
        <div class="col-md-6 mb-3"><label>Correo / contacto</label><input id="correo" type="email" class="form-control" placeholder="correo@ejemplo.com"></div>
        <div class="col-md-4 mb-3"><label>Recurso *</label><select id="recurso" class="form-control" required></select></div>
        <div class="col-md-2 mb-3"><label>Cantidad *</label><input id="cantidad" type="number" min="1" value="1" class="form-control" required></div>
        <div class="col-md-3 mb-3"><label>Fecha inicio *</label><input id="inicio" type="date" class="form-control" required></div>
        <div class="col-md-3 mb-3"><label>Fecha devolución *</label><input id="fin" type="date" class="form-control" required></div>
        <div class="col-12 mb-3"><div id="disponibilidad" class="alert alert-info mb-0">Selecciona un recurso.</div></div>
        <div class="col-12 mb-3"><label>Motivo / observación</label><textarea id="observacion" rows="3" class="form-control" placeholder="Indica para qué necesitas el recurso..."></textarea></div>
      </div>
      <button class="btn btn-primary" type="submit"><i class="fas fa-paper-plane mr-1"></i> Solicitar préstamo</button>
    </form>
  </div>

  <div class="loan-card">
    <h2 class="h5 font-weight-bold mb-3">Mis solicitudes y préstamos</h2>
    <div class="table-responsive"><table class="table table-bordered">
      <thead><tr><th>Recurso</th><th>Datos del solicitante</th><th>Fechas</th><th>Cantidad</th><th>Estado</th><th>Observación</th><th>Acción</th></tr></thead>
      <tbody id="misSolicitudes"></tbody>
    </table></div>
  </div>
</div>
<script src="sena_space_local.js"></script>
<script>
const $=id=>document.getElementById(id);
let recursos=[];
function cargar(){
  SenaSpaceLocal.api('listar_recursos',{},r=>{recursos=r.data.recursos||[]; llenarRecursos(); render(); actualizarDisponibilidad();});
  render();
}
function llenarRecursos(){
  const select=$('recurso');
  const seleccionado=select.value;
  select.innerHTML=recursos.map(r=>`<option value="${r.id}" ${r.estado==='Baja'||Number(r.stock_total)<=0?'disabled':''}>${r.nombre} — ${r.stock_total} disponible(s)</option>`).join('');
  const existe=recursos.some(r=>String(r.id)===String(seleccionado) && r.estado!=='Baja' && Number(r.stock_total)>0);
  if(existe){
    select.value=seleccionado;
  }else{
    const primera=[...select.options].find(o=>!o.disabled);
    if(primera) select.value=primera.value;
  }
}
function actualizarDisponibilidad(){
  const r=recursos.find(x=>Number(x.id)===Number($('recurso').value));
  if(!r){$('disponibilidad').className='alert alert-warning';$('disponibilidad').textContent='No hay recursos disponibles.';return;}
  const q=Number($('cantidad').value)||1;
  if(r.estado==='Baja'||Number(r.stock_total)<=0){$('disponibilidad').className='alert alert-danger';$('disponibilidad').textContent='Este recurso no está disponible para préstamo.';}
  else if(q>Number(r.stock_total)){$('disponibilidad').className='alert alert-warning';$('disponibilidad').textContent=`Stock insuficiente. Disponible: ${r.stock_total}.`}
  else{$('disponibilidad').className='alert alert-success';$('disponibilidad').textContent=`Disponible: ${r.stock_total} unidad(es). Tu solicitud quedará pendiente de aprobación del administrador.`}
}
$('recurso').onchange=actualizarDisponibilidad;$('cantidad').oninput=actualizarDisponibilidad;
$('loanForm').onsubmit=e=>{e.preventDefault();const r=recursos.find(x=>Number(x.id)===Number($('recurso').value));if(!r)return alert('Selecciona un recurso.');SenaSpaceLocal.api('crear_solicitud',{usuario_nombre:$('nombre').value.trim(),usuario_correo:$('correo').value.trim(),usuario_ficha:$('ficha').value.trim(),usuario_telefono:$('telefono').value.trim(),recurso_id:r.id,cantidad:$('cantidad').value,fecha_inicio:$('inicio').value,fecha_devolucion:$('fin').value,observacion:$('observacion').value.trim()},res=>{alert(res.message);if(res.success){$('observacion').value='';render();}})};
function badge(e){const c=e==='Aprobado'?'approved':e==='Rechazado'?'rejected':e==='Devuelto'?'returned':'pending';return `<span class="loan-badge ${c}">${e}</span>`}
function render(){const nombre=($('nombre')?.value||localStorage.getItem('userName')||'').trim().toLowerCase();const data=SenaSpaceLocal.getData();const list=data.solicitudes.filter(s=>!nombre||String(s.usuario_nombre||'').trim().toLowerCase()===nombre||String(s.usuario_correo||'').trim().toLowerCase()===String($('correo')?.value||localStorage.getItem('userEmail')||'').trim().toLowerCase());$('misSolicitudes').innerHTML=list.map(s=>`<tr><td><b>${s.recurso_nombre}</b><br><small>${s.tipo}</small></td><td><b>${s.usuario_nombre || '—'}</b><br><small>Ficha: ${s.usuario_ficha || '—'} · Tel: ${s.usuario_telefono || '—'}</small></td><td>${s.fecha_inicio} → ${s.fecha_devolucion}</td><td>${s.cantidad}</td><td>${badge(s.estado)} ${Number(s.devolucion_solicitada)===1?'<br><span class="loan-badge pending mt-1">Devolución solicitada</span>':''}</td><td>${s.observacion||'—'}</td><td>${s.estado==='Aprobado'&&!Number(s.devolucion_solicitada)?`<button class="btn btn-warning btn-sm" (${s.id})">Solicitar devolución</button>`:s.estado==='Aprobado'&&Number(s.devolucion_solicitada)?'<span class="text-muted"></span>':'—'}</td></tr>`).join('')||'<tr><td colspan="7" class="text-center text-muted">No tienes solicitudes registradas.</td></tr>'}
function solicitarDevolucion(id){SenaSpaceLocal.api('solicitar_devolucion',{id,observacion:'El usuario solicita la devolución del recurso.'},r=>{alert(r.message);render();})}
window.addEventListener('storage',e=>{if(e.key===SenaSpaceLocal.STORAGE_KEY){cargar()}});window.addEventListener('sena-space-local-updated',cargar);setInterval(cargar,1000);
const storedName=localStorage.getItem('userName');if(storedName)$('nombre').value=storedName;const storedEmail=localStorage.getItem('userEmail');if(storedEmail)$('correo').value=storedEmail;const storedFicha=localStorage.getItem('userFicha');if(storedFicha)$('ficha').value=storedFicha;const storedTelefono=localStorage.getItem('userTelefono');if(storedTelefono)$('telefono').value=storedTelefono;cargar();
</script>
</body></html>
